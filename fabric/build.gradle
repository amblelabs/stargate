architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

loom {
    accessWidenerPath = file("src/main/resources/stargate.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        client = true
        outputDirectory = file("../common/src/main/generated")
    }
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version+$rootProject.minecraft_version"
    modImplementation "software.bernie.geckolib:geckolib-fabric-$minecraft_version:$geckolib_version"

    modApi("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modImplementation "com.terraformersmc:modmenu:$rootProject.modmenu_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
}

processResources {
    from project(":common").sourceSets.main.resources

    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

sourcesJar {
    from project(":common").sourceSets.main.allJava
}

sourceSets {
    main.resources.srcDirs += [
            'src/main/generated',
//            '../common/src/main/generated'
    ]
}