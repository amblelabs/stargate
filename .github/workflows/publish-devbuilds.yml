name: Automated Builds

on:
  workflow_dispatch:
  push:
    paths:
      - common/**
      - fabric/**
      #        - forge/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - gradle/**
      - gradlew
      - gradlew.bat
      - versioning.gradle
      - .github/workflows/*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: ./gradlew :fabric:build

      - name: Publish artifacts
        uses: drtheodor/discord-webhook-upload-action@v0.4
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: Macguyver
          avatar: 'https://i.imgur.com/LAzH4IT.jpeg'

          message: |
            <:new1:1253371736510959636><:new2:1253371805734015006> New <:al_stargate:1504663279421882378> **Stargate: Sojourner** (**SGS**) dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/stargate/actions/runs/${{ github.run_id }}>):
            ${commits}

          file: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            forge/build/libs/*.jar
            !forge/build/libs/*-sources.jar

      - name: Send failure notice
        if: failure()
        uses: drtheodor/discord-webhook-upload-action@v0.4
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: Macguyver
          avatar: 'https://i.imgur.com/LAzH4IT.jpeg'

          message: |
            <:al_error:1513885241339678852> New <:al_stargate:1504663279421882378> **Stargate: Sojourner** (**SGS**) dev build [**`#${{ github.run_number }}`**](<https://github.com/amblelabs/stargate/actions/runs/${{ github.run_id }}>) **failed** to build!